name: Deploy to Bloxity

# Builds the frontend on pull requests and pushes to main / dev; pushes (and manual runs) also
# upload the build to Bloxity Hosting (https://hosting.bloxity.io/docs).
# main -> prod channel (https://<gameId>.play.bloxity.io), dev -> dev channel.
# Needs LEGION_GAME_ID (variable or secret) and LEGION_DEPLOY_TOKEN (secret).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  GAME_ID: ${{ vars.LEGION_GAME_ID || secrets.LEGION_GAME_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Determine deploy channel
        id: channel
        run: |
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.base_ref }}" = "main" ]; then
            echo "channel=prod" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        # prod = `vite build`; dev channel = `vite build --mode development`.
        # VITE_DEV_MODE is deliberately unset so deployed builds use the real Bloxity SDK/CDN.
        # No server URL: built games always reach Bubble-bounce-backend through the
        # Bloxity matchmaker (Legion.SDK.net.resolveEndpoint in src/bloxity.js).
        run: |
          if [ "${{ steps.channel.outputs.channel }}" = "prod" ]; then
            npm run build
          else
            npm run build:dev
          fi

      - name: Zip build
        run: cd dist && zip -r ../build.zip . && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build.zip
          retention-days: 7

  deploy:
    # Pull requests only prove the build; deploys happen on push / manual run.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build

      - name: Determine deploy channel
        id: channel
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "channel=prod" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deploy config
        # Fail loudly instead of POSTing to a broken URL / with an empty token.
        run: |
          if [ -z "${GAME_ID}" ]; then
            echo "::error::LEGION_GAME_ID is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "::error::LEGION_DEPLOY_TOKEN is not set (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi
        env:
          DEPLOY_TOKEN: ${{ secrets.LEGION_DEPLOY_TOKEN }}

      - name: Upload to Bloxity
        run: |
          curl -sS -f -X POST \
            "https://api.bloxity.io/v1/hosting/games/${GAME_ID}/frontend?channel=${{ steps.channel.outputs.channel }}&version=${{ github.sha }}" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary @build.zip \
            -w "\nHTTP status: %{http_code}\n"
        env:
          DEPLOY_TOKEN: ${{ secrets.LEGION_DEPLOY_TOKEN }}
